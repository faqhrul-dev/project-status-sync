name: Sync Dev Pipeline

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days"
        default: "14"
      dry_run:
        description: "Preview only, change nothing"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync
        run: node scripts/sync.mjs
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.days || '14' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
